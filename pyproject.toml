[project]
name = "warden-py"
version = "0.1.0"
description = "Personal RSS reader with a daily digest"
readme = "README.md"
authors = [
    { name = "Nikita Savelev", email = "pybepod@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
warden-py = "warden_py:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
